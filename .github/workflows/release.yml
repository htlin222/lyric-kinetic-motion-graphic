name: Render & Release
on:
  push:
    tags: ['v*']
    branches: [release]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render film
        run: ./build.sh assets/song.mp3
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="$(cat VERSION)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "REVERSE JING-JING (逆晶晶體) — kinetic lyric film $TAG" --notes-file .github/release-notes.md
          gh release upload "$TAG" out/reverse-jing-jing.mp4 --clobber
